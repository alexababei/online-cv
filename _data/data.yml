career-profile:
    title: Perfil
    summary: |
      Profesional con 5 años de experiencia en el sector de la información.            
      Me especializo en administrar sistemas Linux, desde sus fases pre-productivas hasta las críticas.            
      Familiarizado con una amplia gama de herramientas corporativas.            
      Desde siempre he trabajado con equipos, siendo proactivo y colaborador.

