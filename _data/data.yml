experiences:
    title: Experiencia Laboral
    info:
      - role: Técnico de sistemas N2 - Linux/Windows
        time: Enero 2022 - Actualidad
        company: VASS - "Proyecto Telefónica"
        details: |
          Mis roles se dividen en 2 categorías:
            - Administración cola de archivos (MIDDLEWARE)
                - Herramientas de transmisión de ficheros: Dataone y Spazio
                - Creación de flujo de datos entre diferentes máquinas/entornos (SAP, APPIAN)
                - Mantenimiento de flujos: añadir/modificar/eliminar componentes del flujo.
                - Atención de incidencias y peticiones de clientes.
            - Operador de aplicaciones y sistemas (AO)
                 - Despliegue de aplicativos, producción y pre-producción (Jenkins) 
                 - Incidencias y cambios en infraestructura (BMC ITSM, Outlook) 
                 - Arranques/paradas/reinicios de aplicativos webs. (JBOSS/Apache, IIS) 
                 - Programación de scripts para aplicativos (Bash, Python) 
                 - Ejecución de SQL y mantenimiento de BBDD. (Oracle, SQL Server) 
                 - Control de usuarios y contraseñas (LDAP, Active Directory) 
                 - Gestión de filesystems (LVM, NAS) 
                 - Cambio de certificaciones y claves. (cer, pfx, csr) 
      - role: Soporte Helpdesk N1 (24x7)
        time: Octubre 2020 – Enero 2022
        company: Indra - "Proyecto BBVA"
        details: |
          Funciones principales dentro de la empresa:
            - Monitoreo de servicios con la herramienta BMC Impact. - - - - 
            - Gestión y resolución de incidencias en plataformas ticketing: JIRA y Remedy. 
            - Manejo de correos (Gmail) y atención de llamadas telefónicas (Contact Center) 
            - Ejecución de jobs en Control-M. 
            - Operativas en Unix y Windows:  
                - Reinicio controlado de servidores (CRQ)
                - Despliegue de versiones 
                - Mantenimiento de servicios (parada/arranque/reinicio)
                
